name: Deploy CRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Vite base path (e.g., /Customer-Relationship-Management-Platform/ or /)'
        required: false
        default: '/Customer-Relationship-Management-Platform/'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Test & Validate Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend automated test suite
        working-directory: backend
        run: npm test

  build:
    name: Build & Package Frontend
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'true'
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: ${{ inputs.base_path || '/Customer-Relationship-Management-Platform/' }}
        run: npm run build

      - name: Setup SPA Routing and Disable Jekyll
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
