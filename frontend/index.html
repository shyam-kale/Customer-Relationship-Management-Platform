    <!-- GitHub Pages SPA: restore path encoded by 404.html -->
    <script>
      (function(){
        var qs = window.location.search
        if (qs && qs.indexOf('?p=') === 0) {
          var path = decodeURIComponent(qs.slice(3).replace(/&h=.*$/, ''))
          var hash = qs.match(/&h=([^&]*)/) ? '#' + decodeURIComponent(qs.match(/&h=([^&]*)/)[1]) : ''
          window.history.replaceState(null, null,
            window.location.pathname.split('/').slice(0,2).join('/') + '/' + path + hash
          )
        }
      })()
    </script>
